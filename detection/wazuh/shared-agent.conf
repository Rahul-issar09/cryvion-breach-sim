<!-- Pushed by the manager to all agents in the 'default' group. -->
<agent_config>

  <!-- Tail the CryvionPortal security log (web tier) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cryvion/security.log</location>
  </localfile>

  <!-- sshd auth events (internal tier) — containers log to a file, not journald -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Realtime FIM on the upload dir (web shell) and cron dir (persistence) -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/app/uploads</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d</directories>
  </syscheck>

</agent_config>
